listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

# Durable sessions, for subscribers that must not miss an event.
#
# The telemetry bridge subscribes with a persistent session (clean_session
# false) and acknowledges each message only after the reading is committed, so
# whatever it has not acknowledged has to survive both its own restart and this
# broker's. A session with nothing written to disk survives neither: on restart
# the broker has no record of the subscription, the client falls back to a
# clean session, and everything queued for it is gone without a word.
persistence true
persistence_location /mosquitto/data/

# Persistence is a periodic checkpoint, not a journal, so the setting above
# covers a broker that shuts down cleanly and nothing else. Mosquitto writes the
# session database on a clean exit, on SIGUSR1, and every autosave_interval
# seconds -- and the default interval is 1800, so a broker that dies outright
# (a power blip, an OOM kill) takes up to half an hour of queued-but-unsaved
# session state with it.
#
# What that costs is the whole session rather than just its queue. Measured
# against the 2.1.2 image: a dozen QoS 1 messages queued for an offline
# persistent session, no checkpoint, then SIGKILL -- and the reconnect comes
# back with session-present clear and not one of them delivered. The broker has
# forgotten the subscription as well, so a subscriber that does not re-subscribe
# on reconnect is left connected to a broker that will never send it anything
# again. The bridge does re-subscribe on every connect, which is what makes this
# a bounded data loss rather than a farm that goes silent until someone notices.
#
# 30s is the bound. Seconds rather than a change count (autosave_on_changes)
# because a threshold in messages is the wrong unit here: a few hundred devices
# reporting every fifteen minutes need minutes to accumulate a hundred
# messages, so a count that is tight on this bench is a long window on the
# fleet it is meant to protect.
autosave_interval 30

# What a disconnected session is allowed to accumulate before the broker starts
# discarding. The default is 1000 messages per client, and past it delivery is
# dropped silently -- ChirpStack's publish was already acknowledged, so nothing
# upstream ever learns of it.
#
# That default is the entire outage budget. On this bench it is generous; on a
# real farm a few hundred devices reporting every fifteen minutes exhaust it in
# minutes, which is shorter than an ordinary restart of the consumer. Raised so
# an outage costs latency rather than data -- a few thousand small JSON events
# is a few megabytes of queue.
#
# Not a substitute for sizing against a real fleet. It is a bench default
# chosen to fail visibly rather than invisibly.
#
# Two numbers carry "latency rather than data", not one: this bounds what a
# long outage may queue, and autosave_interval above bounds what an unclean
# death may discard. scripts/farm-e2e.sh asserts both.
max_queued_messages 10000
