#
# One-command bench: ChirpStack (US915) + Leftenant + a standalone events store.
#
#   cp .env.example .env && docker compose up -d --build
#
# A one-shot `provisioner` runs after ChirpStack is up, creates the
# "Intelligent Farming" tenant + a tenant API key, and writes the connection
# artifacts to the `shared` volume. Leftenant boots already configured with that
# key.
#
# Device events are stored by ChirpStack's own PostgreSQL integration: ChirpStack
# writes every event (uplinks, joins, acks, status, …) straight into `events-postgres`,
# auto-creating its `event_*` tables on first boot. `events-api` (PostGraphile) serves a
# read-only GraphQL/GraphiQL endpoint over them. No separate collector; nothing here
# depends on the intelligent-farming-hub repo.
#
# Leftenant runs an image built from its public repo (github.com/intelligent-farming/leftenant,
# main) by the setup scripts via `docker build <giturl>` — no local clone, and no compose git-URL
# build context (that one breaks on Windows). Everything else uses published images or builds in-repo.
name: intelligent-farming-stack

services:
  # ── ChirpStack core ────────────────────────────────────────────────────────
  chirpstack-postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chirpstack
      POSTGRES_PASSWORD: chirpstack
      POSTGRES_DB: chirpstack
    volumes:
      - ./postgresql/initdb:/docker-entrypoint-initdb.d:ro
      - chirpstack-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirpstack -d chirpstack"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MOSQUITTO_MQTT_PORT:-1883}:1883"   # native MQTT (gateways; in-network clients use the service name)
      - "${MOSQUITTO_WS_PORT:-9001}:9001"     # MQTT over websockets (Leftenant join monitor, browser-side)
    volumes:
      - ./mosquitto:/mosquitto/config/:ro
      # Where mosquitto.conf's `persistence true` actually writes. Without a
      # volume the session state lives in the container's writable layer and is
      # discarded with it, so a durable subscription would survive a broker
      # restart but not a `docker compose up` that recreates the container.
      - mosquitto-data:/mosquitto/data

  chirpstack:
    image: chirpstack/chirpstack:4
    restart: unless-stopped
    command: -c /etc/chirpstack
    volumes:
      - ./chirpstack:/etc/chirpstack:ro
    environment:
      POSTGRESQL_HOST: chirpstack-postgres
      REDIS_HOST: redis
      MQTT_BROKER_HOST: mosquitto
      API_SECRET: ${CHIRPSTACK_API_SECRET:-change-me-please}
      # Active region/sub-band. Expands into enabled_regions in chirpstack.toml and
      # must match the gateway bridges' topic prefix (both use REGION). Default us915_0.
      REGION: ${REGION:-us915_0}
      # PostgreSQL integration target — ChirpStack writes every device event into
      # this standalone DB and auto-creates the event_* tables there on first boot.
      # These expand into the [integration.postgresql] dsn in chirpstack/chirpstack.toml.
      EVENTS_POSTGRESQL_HOST: events-postgres
      EVENTS_POSTGRESQL_USER: ${EVENTS_POSTGRES_USER:-events}
      EVENTS_POSTGRESQL_PASSWORD: ${EVENTS_POSTGRES_PASSWORD:-changeme}
      EVENTS_POSTGRESQL_DB: ${EVENTS_POSTGRES_DB:-chirpstack_events}
    ports:
      - "${CHIRPSTACK_HOST_PORT:-8080}:8080"   # admin UI + gRPC
    depends_on:
      chirpstack-postgres:
        condition: service_healthy
      events-postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      redis:
        condition: service_started

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    restart: unless-stopped
    # --cors must match the browser origin Leftenant is served from. Override
    # LEFTENANT_ORIGIN in .env when reaching the bench by LAN IP instead of localhost.
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure --cors ${LEFTENANT_ORIGIN:-http://localhost:4173}
    ports:
      - "${CHIRPSTACK_REST_HOST_PORT:-8090}:8090"
    depends_on:
      - chirpstack

  # Semtech UDP packet-forwarder gateways (legacy protocol, UDP :1700).
  # The MQTT topic prefix is the REGION flag (default us915_0 — see .env), and must
  # match ChirpStack's enabled region. Flip REGION to us915_1 (or any band whose
  # region file is present) to change sub-band. Caveat: that holds for real
  # gateways. The bundled mock-sensors harness only knows the US915 channel plans
  # and throws on any other REGION, so a non-US915 band means no mock data.
  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    ports:
      - "${GATEWAY_BRIDGE_UDP_PORT:-1700}:1700/udp"   # Semtech UDP packet forwarder
    volumes:
      - ./gateway-bridge:/etc/chirpstack-gateway-bridge:ro
    environment:
      INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE: ${REGION:-us915_0}/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE: ${REGION:-us915_0}/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE: ${REGION:-us915_0}/gateway/{{ .GatewayID }}/command/#
    depends_on:
      - mosquitto

  # BasicStation gateways (LNS WebSocket, TCP :3001). Same REGION topic prefix as the
  # UDP bridge, so ChirpStack handles both. Point the gateway's LNS/tc URI at
  # ws://<this-host-ip>:3001. The REGION flag also selects the channel-plan file
  # (chirpstack-gateway-bridge-basicstation-${REGION}.toml) — us915_0 and us915_1
  # ship with the stack; add gateway-bridge/…-<band>.toml for other bands.
  chirpstack-gateway-bridge-basicstation:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    command: -c /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge-basicstation-${REGION:-us915_0}.toml
    ports:
      - "${GATEWAY_BRIDGE_BASICSTATION_PORT:-3001}:3001"   # BasicStation LNS WebSocket
    volumes:
      - ./gateway-bridge:/etc/chirpstack-gateway-bridge:ro
    environment:
      INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE: ${REGION:-us915_0}/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE: ${REGION:-us915_0}/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE: ${REGION:-us915_0}/gateway/{{ .GatewayID }}/command/#
    depends_on:
      - mosquitto

  # ── Provisioner (one-shot) ──────────────────────────────────────────────────
  provisioner:
    build: ./provisioning
    restart: "no"
    environment:
      # Provisioning (login, tenant, api-key) goes over gRPC — the REST gateway
      # does not expose InternalService/ApiKeyService.
      CHIRPSTACK_GRPC: chirpstack:8080
      # REST endpoint passed to attach-codecs.py (codec attach uses REST).
      CHIRPSTACK_REST_URL: http://chirpstack-rest-api:8090
      CHIRPSTACK_ADMIN_EMAIL: ${CHIRPSTACK_ADMIN_EMAIL:-admin}
      CHIRPSTACK_ADMIN_PASSWORD: ${CHIRPSTACK_ADMIN_PASSWORD:-admin}
      TENANT_NAME: ${TENANT_NAME:-Intelligent Farming}
      API_KEY_NAME: ${API_KEY_NAME:-intelligent-farming-stack}
      # Browser-facing URLs written into Leftenant's config.json. Change these
      # (and LEFTENANT_ORIGIN above) when the bench is reached by LAN IP.
      LEFTENANT_CHIRPSTACK_URL: ${LEFTENANT_CHIRPSTACK_URL:-http://localhost:8090}
      LEFTENANT_MQTT_URL: ${LEFTENANT_MQTT_URL:-ws://localhost:9001}
      # Host a physical gateway forwards to (Gateway Bridge, published at :1700 /
      # :3001). setup.sh auto-detects the host LAN IP into this; if unset the
      # provisioner falls back to the LEFTENANT_CHIRPSTACK_URL host.
      LEFTENANT_GATEWAY_BRIDGE_HOST: ${LEFTENANT_GATEWAY_BRIDGE_HOST:-}
    volumes:
      - shared:/shared
      # Best-effort codec attach: if codec .js files are present at CODECS_DIR,
      # attach-codecs.py runs against the new tenant key. Optional and orthogonal
      # to the event store — a missing/empty dir just makes this a no-op. Defaults
      # to the git-ignored Makerfabs codecs if that repo happens to be cloned
      # alongside; point CODECS_DIR at any local folder to decouple entirely.
      - ${CODECS_DIR:-./codecs}:/codecs:ro
    depends_on:
      - chirpstack            # gRPC provisioning target
      - chirpstack-rest-api   # used by the best-effort codec attach

  # ── Leftenant (pre-configured provisioning UI) ──────────────────────────────
  leftenant:
    # Runs an image built from the public repo's latest main. We intentionally do
    # NOT use compose's `build:` git-URL support: compose mis-resolves a remote git
    # context as a local path on Windows (docker/compose#13815 — "filename, directory
    # name, or volume label syntax is incorrect"). Instead the setup scripts and the
    # one-line installer build this tag with `docker build <giturl>` (the buildx CLI
    # clones the repo server-side, which works on every platform). Build it with:
    #   docker build -t intelligent-farming-stack/leftenant:local https://github.com/intelligent-farming/leftenant.git#main
    image: ${LEFTENANT_IMAGE:-intelligent-farming-stack/leftenant:local}
    restart: unless-stopped
    ports:
      - "${LEFTENANT_HOST_PORT:-4173}:80"
    volumes:
      - shared:/shared:ro   # entrypoint reads /shared/config.json written by the provisioner
    depends_on:
      provisioner:
        condition: service_completed_successfully

  # ── Standalone device-event store (ChirpStack PostgreSQL integration target) ──
  events-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # wal_level is `replica` by default. Set EVENTS_POSTGRES_WAL_LEVEL=logical (see
    # .env) to enable log-based CDC for Fivetran, then recreate this container:
    # `docker compose up -d events-postgres`. The slot/sender counts below are the
    # PG16 defaults, surfaced so one Fivetran slot fits without extra tuning.
    command:
      - "postgres"
      - "-c"
      - "wal_level=${EVENTS_POSTGRES_WAL_LEVEL:-replica}"
      - "-c"
      - "max_wal_senders=${EVENTS_POSTGRES_MAX_WAL_SENDERS:-10}"
      - "-c"
      - "max_replication_slots=${EVENTS_POSTGRES_MAX_REPLICATION_SLOTS:-10}"
    environment:
      # ChirpStack connects as this owner role and auto-creates the event_* tables.
      POSTGRES_USER: ${EVENTS_POSTGRES_USER:-events}
      POSTGRES_PASSWORD: ${EVENTS_POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${EVENTS_POSTGRES_DB:-chirpstack_events}
      # Read-only role PostGraphile connects as (created by initdb 010_events_roles.sh).
      POSTGRES_API_USER: ${EVENTS_POSTGRES_API_USER:-events_api}
      POSTGRES_API_PASSWORD: ${EVENTS_POSTGRES_API_PASSWORD:-changeme-api}
      # Opt-in read-only replication role for Fivetran; the same init script creates
      # it (+ publication) only when both are set (blank = disabled).
      POSTGRES_FIVETRAN_USER: ${EVENTS_POSTGRES_FIVETRAN_USER:-}
      POSTGRES_FIVETRAN_PASSWORD: ${EVENTS_POSTGRES_FIVETRAN_PASSWORD:-}
      POSTGRES_FIVETRAN_PUBLICATION: ${EVENTS_POSTGRES_FIVETRAN_PUBLICATION:-fivetran_pub}
    volumes:
      - eventsdata:/var/lib/postgresql/data
      - ./postgresql/events-initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback-only by default. Flip EVENTS_POSTGRES_HOST_BIND to 0.0.0.0 (or a
      # specific LAN/VPN address) to let an off-device consumer like Fivetran
      # reach Postgres. Expose beyond the device only over TLS + a firewall
      # scoped to the consumer's source IPs, using the read-only events_api role.
      - "${EVENTS_POSTGRES_HOST_BIND:-127.0.0.1}:${EVENTS_POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: block until ChirpStack has created its event_up table, so events-api
  # introspects a populated schema on first boot (matches the provisioner idiom).
  events-schema-wait:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: events-postgres
      PGUSER: ${EVENTS_POSTGRES_USER:-events}
      PGPASSWORD: ${EVENTS_POSTGRES_PASSWORD:-changeme}
      PGDATABASE: ${EVENTS_POSTGRES_DB:-chirpstack_events}
    entrypoint:
      - "bash"
      - "-c"
      - |
        echo "waiting for ChirpStack to create public.event_up ..."
        until [ "$$(psql -tAc "SELECT to_regclass('public.event_up') IS NOT NULL")" = "t" ]; do
          sleep 2
        done
        echo "event_up exists — schema ready"
    depends_on:
      events-postgres:
        condition: service_healthy
      chirpstack:
        condition: service_started

  # ── Read-only GraphQL/GraphiQL over the event store ───────────────────────────
  events-api:
    build: ./events-api
    restart: unless-stopped
    environment:
      # Connects as the read-only events_api role; creds via env (not CLI args) so
      # they don't show up in the container's process list.
      DATABASE_URL: postgres://${EVENTS_POSTGRES_API_USER:-events_api}:${EVENTS_POSTGRES_API_PASSWORD:-changeme-api}@events-postgres:5432/${EVENTS_POSTGRES_DB:-chirpstack_events}
      API_GRAPHIQL: ${EVENTS_API_GRAPHIQL:-true}
    ports:
      # host 5050 by default: port 5000 is taken by the macOS AirPlay Receiver.
      - "${EVENTS_API_HOST_BIND:-127.0.0.1}:${EVENTS_API_HOST_PORT:-5050}:5000"
    depends_on:
      events-postgres:
        condition: service_healthy
      events-schema-wait:
        condition: service_completed_successfully

  # ── Farm telemetry store (opt-in via the `farm` profile) ──────────────────────
  # The normalized telemetry path: ChirpStack's MQTT events become narrow
  # per-metric readings in `farmdata`, each stamped with the property the device
  # was on when it measured. This is a different thing from the event store
  # above, which archives ChirpStack's own event shape verbatim; the two run
  # side by side and neither reads the other.
  #
  # All four services below sit behind the `farm` profile, so nothing here is
  # built or started unless it is named:
  #   docker compose --profile farm up -d
  # Tearing down needs the profile too, or these are left running:
  #   docker compose --profile farm down
  #
  # THE IMAGES ARE NOT PUBLISHED YET. Three of the four are built in the
  # telemetry-bridge repository and consumed here by tag from the local Docker
  # image store — this stack does not build from a sibling checkout (and cannot;
  # compose's git-URL build context breaks on Windows, the same reason Leftenant
  # is built the way it is). Build them once, in a telemetry-bridge checkout:
  #   npm run images:build
  # Without that, `up` fails with "pull access denied for
  # intelligent-farming/farm-postgres". See the README.
  farm-postgres:
    profiles: ["farm"]
    image: ${FARM_POSTGRES_IMAGE:-intelligent-farming/farm-postgres:dev}
    restart: unless-stopped
    # postgres:18 plus pg_partman and PostGIS. The settings below are surfaced
    # for the same reason events-postgres surfaces its own: changing
    # shared_preload_libraries costs a restart, so the worker is preloaded from
    # first boot even though it stays idle.
    #
    # pg_partman_bgw.dbname is deliberately EMPTY. Pointing the background
    # worker at a database before the migration chain has installed pg_partman
    # makes it fail every cycle and log at ERROR. Set it only against a database
    # farmdata-migrate has already migrated at least once.
    command:
      - "postgres"
      - "-c"
      - "wal_level=${FARM_POSTGRES_WAL_LEVEL:-replica}"
      - "-c"
      - "max_wal_senders=${FARM_POSTGRES_MAX_WAL_SENDERS:-10}"
      - "-c"
      - "max_replication_slots=${FARM_POSTGRES_MAX_REPLICATION_SLOTS:-10}"
      - "-c"
      - "max_slot_wal_keep_size=${FARM_POSTGRES_MAX_SLOT_WAL_KEEP_SIZE:-2GB}"
      - "-c"
      - "shared_preload_libraries=${FARM_POSTGRES_SHARED_PRELOAD:-pg_partman_bgw}"
      - "-c"
      - "pg_partman_bgw.dbname=${FARM_POSTGRES_PARTMAN_BGW_DBNAME:-}"
    environment:
      # The owning superuser: CREATE EXTENSION pg_partman requires one. The
      # least-privilege roles the services actually connect as are created by
      # the migration chain, and their login accounts by farmdata-migrate.
      POSTGRES_USER: ${FARM_POSTGRES_USER:-farmdata_owner}
      POSTGRES_PASSWORD: ${FARM_POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${FARM_POSTGRES_DB:-farmdata}
      # Not a knob: initdb reads this once, at first boot, and editing it later
      # has no effect on an existing volume. The builtin provider ties collation
      # to the server version rather than the base image's libc, so a glibc bump
      # cannot silently invalidate a text index; C is pinned explicitly so an
      # unset value cannot inherit the image's own locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. From 18 the official
      # image puts the cluster at /var/lib/postgresql/18/docker — inside this
      # path rather than at its root. Mounting the old path leaves the cluster
      # in the container's writable layer, where it is silently discarded on
      # every recreate.
      - farmdata:/var/lib/postgresql
    ports:
      # Loopback only, like the event store. 5436 rather than 5434 (that store)
      # or 5435 (the telemetry-bridge repo's own dev harness), so all three can
      # run side by side.
      - "${FARM_POSTGRES_HOST_BIND:-127.0.0.1}:${FARM_POSTGRES_HOST_PORT:-5436}:5432"
    healthcheck:
      # Over TCP, not the unix socket. On first boot the entrypoint runs a
      # temporary server that listens only on the socket, so a socket probe
      # reports healthy in the middle of initdb and everything gated on this
      # starts against a database that is about to be restarted.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: brings the database up to the migration chain, mints the login
  # users the two services below connect as, and loads the organization and
  # property projections. Runs to completion and stays exited; compose restarts
  # it on every `up`, which is intended — every step is idempotent, and a second
  # run applies no migrations and rewrites the same rows.
  #
  # It carries the owning superuser's credential, which is why it is separate
  # from the daemon: CREATE EXTENSION needs a superuser, and nothing
  # long-running should hold one. A failure here leaves everything gated on it
  # unstarted rather than running against a half-migrated database — read it
  # with `docker compose logs farmdata-migrate`.
  farmdata-migrate:
    profiles: ["farm"]
    image: ${FARMDATA_MIGRATE_IMAGE:-intelligent-farming/farmdata-migrate:dev}
    restart: "no"
    depends_on:
      farm-postgres:
        condition: service_healthy
    environment:
      # In-network address: the service name compose's DNS resolves, not the
      # published loopback port. The migration tooling reads HOST_BIND as the
      # client host, which is what lets its configuration file work unchanged.
      FARM_POSTGRES_HOST_BIND: farm-postgres
      FARM_POSTGRES_HOST_PORT: "5432"
      FARM_POSTGRES_USER: ${FARM_POSTGRES_USER:-farmdata_owner}
      FARM_POSTGRES_PASSWORD: ${FARM_POSTGRES_PASSWORD:-changeme}
      FARM_POSTGRES_DB: ${FARM_POSTGRES_DB:-farmdata}
      # The accounts the bridge and the GraphQL layer connect as. The chain
      # creates only NOLOGIN group roles — carriers of privileges, not
      # credentials — so these are minted here, each granted membership in
      # exactly one of them. Bench placeholders; rotate for anything real.
      FARM_BRIDGE_LOGIN_USER: ${FARM_BRIDGE_LOGIN_USER:-farmdata_bridge}
      FARM_BRIDGE_LOGIN_PASSWORD: ${FARM_BRIDGE_LOGIN_PASSWORD:-changeme-bridge}
      FARM_API_LOGIN_USER: ${FARM_API_LOGIN_USER:-farmdata_api}
      FARM_API_LOGIN_PASSWORD: ${FARM_API_LOGIN_PASSWORD:-changeme-farm-api}
      # A path inside the container: the mount below, not a host path.
      FARM_PROJECTION_SEED: /seed/projection.json
    volumes:
      - ./farm/projection.json:/seed/projection.json:ro

  # The bridge itself: consumes ChirpStack's MQTT events, writes normalized
  # readings, mirrors the ChirpStack device list, and serves the farm-local
  # curation API an operator uses to say where a device actually is.
  telemetry-bridge:
    profiles: ["farm"]
    image: ${TELEMETRY_BRIDGE_IMAGE:-intelligent-farming/telemetry-bridge:dev}
    restart: unless-stopped
    # Wrapped, because the ChirpStack API key does not exist until the
    # provisioner has minted it and is written only to the shared volume — no
    # environment variable can carry it. The shim reads it, derives the default
    # property from the same seed file the migration one-shot loaded, and execs
    # the daemon. Invoked through sh so it does not need an executable bit.
    entrypoint: ["/bin/sh", "/farm/bridge-entrypoint.sh"]
    depends_on:
      farmdata-migrate:
        condition: service_completed_successfully
      provisioner:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
      chirpstack-rest-api:
        condition: service_started
    environment:
      # In-network addresses throughout — service names, not the host-side
      # loopback ports these services publish.
      FARM_BRIDGE_MQTT_URL: mqtt://mosquitto:1883
      # One client id per broker: the session is persistent, so a second daemon
      # using this id would take the session over and the two would disconnect
      # each other in a loop. Never scale this service.
      FARM_BRIDGE_CLIENT_ID: ${FARM_BRIDGE_CLIENT_ID:-telemetry-bridge}
      FARM_BRIDGE_SIGNAL_HEALTH: ${FARM_BRIDGE_SIGNAL_HEALTH:-on}
      # Connects as the minted login, not the owner: it is a member of
      # bridge_writer and assumes that role for each transaction.
      FARM_POSTGRES_HOST_BIND: farm-postgres
      FARM_POSTGRES_HOST_PORT: "5432"
      FARM_POSTGRES_USER: ${FARM_BRIDGE_LOGIN_USER:-farmdata_bridge}
      FARM_POSTGRES_PASSWORD: ${FARM_BRIDGE_LOGIN_PASSWORD:-changeme-bridge}
      FARM_POSTGRES_DB: ${FARM_POSTGRES_DB:-farmdata}
      # Blank on purpose: the entrypoint derives it from farm/projection.json,
      # so the UUID has exactly one authoritative copy. Set it to override.
      FARM_BRIDGE_PROPERTY_ID: ${FARM_BRIDGE_PROPERTY_ID:-}
      # The inventory reconciler. The key and tenant id come from the shared
      # volume via the entrypoint; only the URL is knowable in advance.
      FARM_BRIDGE_CHIRPSTACK_URL: http://chirpstack-rest-api:8090
      FARM_BRIDGE_RECONCILE_INTERVAL_SECONDS: ${FARM_BRIDGE_RECONCILE_INTERVAL_SECONDS:-600}
      FARM_BRIDGE_CHIRPSTACK_TIMEOUT_SECONDS: ${FARM_BRIDGE_CHIRPSTACK_TIMEOUT_SECONDS:-10}
      # The curation API. On here, off in the daemon's own default: this file
      # exists to serve the bridge, while a bare run on someone's workstation
      # has no business opening an unauthenticated write API.
      FARM_BRIDGE_CURATION_API: "on"
      # 0.0.0.0 *inside the container*, which is not the same as exposing it —
      # the published port below decides who can reach it, and stays on
      # loopback. A container-internal loopback bind could not be published.
      FARM_BRIDGE_CURATION_BIND: "0.0.0.0"
      FARM_BRIDGE_CURATION_PORT: "8091"
      FARM_BRIDGE_CURATION_LAG_DAYS: ${FARM_BRIDGE_CURATION_LAG_DAYS:-7}
      FARM_BRIDGE_CURATION_CHECK_INTERVAL_SECONDS: ${FARM_BRIDGE_CURATION_CHECK_INTERVAL_SECONDS:-3600}
    volumes:
      - shared:/shared:ro                                    # the provisioner's config.json
      - ./farm/bridge-entrypoint.sh:/farm/bridge-entrypoint.sh:ro
      - ./farm/projection.json:/seed/projection.json:ro      # for the default-property derivation
    ports:
      # THIS RELEASE SERVES NO AUTHENTICATION AND NO TLS on the curation API.
      # Loopback only; move that bind only behind both. 8092 rather than 8091,
      # which the telemetry-bridge repo's own dev harness publishes.
      - "${FARM_CURATION_HOST_BIND:-127.0.0.1}:${FARM_CURATION_HOST_PORT:-8092}:8091"

  # ── Read-only GraphQL/GraphiQL over the farm telemetry store ──────────────────
  farmdata-api:
    profiles: ["farm"]
    build: ./farm-api
    restart: unless-stopped
    environment:
      # Connects as the minted farm_read member — read-only by role, not by
      # convention. Creds via env (not CLI args) so they stay out of the
      # container's process list, the same as events-api.
      #
      # Discrete settings rather than a DATABASE_URL, deliberately: a URL has
      # to be interpolated here, nothing in compose can escape what goes into
      # it, and a rotated password carrying `/`, `#`, or `?` re-splits the URL
      # instead of failing it — leaving `pg` connecting to a host named after
      # the username. These are pg's own canonical variable names, so the
      # password is handed over as a value and never parsed. server.js still
      # honors DATABASE_URL when one is set, for pointing this elsewhere.
      PGHOST: farm-postgres
      PGPORT: "5432"
      PGUSER: ${FARM_API_LOGIN_USER:-farmdata_api}
      PGPASSWORD: ${FARM_API_LOGIN_PASSWORD:-changeme-farm-api}
      PGDATABASE: ${FARM_POSTGRES_DB:-farmdata}
      API_GRAPHIQL: ${FARM_API_GRAPHIQL:-true}
    ports:
      - "${FARM_API_HOST_BIND:-127.0.0.1}:${FARM_API_HOST_PORT:-5051}:5000"
    depends_on:
      farm-postgres:
        condition: service_healthy
      # Load-bearing, not just ordering: PostGraphile introspects once at boot
      # and watchPg is off, so a schema that arrives afterwards stays invisible
      # until this container is restarted.
      farmdata-migrate:
        condition: service_completed_successfully

  # ── Mock sensors (demo data generator; opt-in via the `mock` profile) ─────────
  # Simulates a handful of real ag sensors: builds valid LoRaWAN uplinks (MIC +
  # encrypted payload) and pushes them to the gateway bridge over Semtech UDP,
  # exactly like a real gateway — so mocked readings flow through ChirpStack's
  # decode into event_up and the MQTT app stream. Never runs by default; start it
  # with `docker compose --profile mock up -d mock-sensors`. It reads the tenant
  # API key from the shared volume (like Leftenant) and provisions its own
  # gateway/app/profiles/devices (idempotent) before emitting.
  #
  # The harness is US915-only: it derives uplink RF params for us915_0/us915_1 and
  # throws on any other REGION (see mock-sensors/README.md "RF parameters").
  mock-sensors:
    build: ./mock-sensors
    profiles: ["mock"]
    restart: unless-stopped
    environment:
      CHIRPSTACK_REST_URL: http://chirpstack-rest-api:8090
      # The harness's Semtech-UDP *target*. Deliberately not GATEWAY_BRIDGE_UDP_*:
      # at the repo root that name is the published host port mapping
      # ("${GATEWAY_BRIDGE_UDP_PORT}:1700/udp"), and on this compose network the
      # target is always the container port 1700 regardless of that mapping.
      MOCK_UDP_HOST: chirpstack-gateway-bridge
      MOCK_UDP_PORT: "1700"
      REGION: ${REGION:-us915_0}
      MOCK_INTERVAL_SECONDS: ${MOCK_INTERVAL_SECONDS:-15}
      MOCK_GATEWAY_EUI: ${MOCK_GATEWAY_EUI:-da7a9a7e00000001}
    volumes:
      - shared:/shared:ro   # reads /shared/config.json (tenant API key + id)
    command: ["run"]
    depends_on:
      provisioner:
        condition: service_completed_successfully
      chirpstack:
        condition: service_started
      # All of the harness's own provisioning (gateway, app, profiles, devices)
      # goes through the REST gateway. Without this it only arrived transitively
      # via provisioner — whose REST work is conditional on CODECS_DIR — so a cold
      # `--profile mock up` could hit ECONNREFUSED and crash-loop under
      # `restart: unless-stopped` until the gateway happened to be listening.
      chirpstack-rest-api:
        condition: service_started
      chirpstack-gateway-bridge:
        condition: service_started

volumes:
  chirpstack-pgdata:
  redisdata:
  eventsdata:
  shared:
  mosquitto-data:
  farmdata:
